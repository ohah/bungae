name: Lint and Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.changes.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            ts:
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - '*.ts'
              - '*.js'
              - 'oxlint.json'
              - '.oxfmtrc.json'
              - '.github/workflows/lint.yml'

  lint:
    name: Lint TypeScript/JavaScript
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Skip if no changes
        if: needs.check.outputs.should-run != 'true'
        run: echo "No TypeScript/JavaScript changes, skipping lint"
        continue-on-error: false

      - name: Setup Bun
        if: needs.check.outputs.should-run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: needs.check.outputs.should-run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        if: needs.check.outputs.should-run == 'true'
        run: npm install -g pnpm@10.23.0

      - name: Setup Rust
        if: needs.check.outputs.should-run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: needs.check.outputs.should-run == 'true'
        uses: actions/cache@v4
        with:
          path: rolldown/target
          key: rolldown-rust-${{ runner.os }}-${{ hashFiles('rolldown/Cargo.lock') }}
          restore-keys: rolldown-rust-${{ runner.os }}-

      - name: Build rolldown submodule
        if: needs.check.outputs.should-run == 'true'
        run: |
          cd rolldown
          pnpm install
          pnpm --filter rolldown run build-binding --release
          pnpm --filter rolldown run build-node
          pnpm --filter @rolldown/pluginutils run build

      - name: Link rolldown
        if: needs.check.outputs.should-run == 'true'
        run: |
          cd rolldown/packages/rolldown && bun link
          cd ../../../ && bun install

      - name: Run oxlint
        if: needs.check.outputs.should-run == 'true'
        run: bun run lint

      - name: Check formatting
        if: needs.check.outputs.should-run == 'true'
        run: bun run format:check

      - name: Type check
        if: needs.check.outputs.should-run == 'true'
        run: bun run typecheck
